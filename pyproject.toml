[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-relationship-analyzer"
version = "0.1.0"
description = "End-to-end research paper relationship analyzer with KG, contradiction detection, and gap discovery"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "PyMuPDF>=1.23.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.41.0",
    "torch>=2.6.0",
    "networkx>=3.3",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
]

[project.scripts]
rpra = "rpra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
