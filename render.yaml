services:
  - type: web
    name: research-paper-analyzer-api
    env: python
    buildCommand: "pip install -e ."
    startCommand: "uvicorn rpra.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional. Without it the pipeline uses the heuristic extraction
      # backend, which needs no key and runs fully offline.
      - key: OPENAI_API_KEY
        sync: false
