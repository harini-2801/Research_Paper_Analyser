# Render deployment for the analysis API.
#
# The build installs the CORE dependencies only. The full dependency set
# includes torch, transformers and sentence-transformers, which come to roughly
# 2.5 GB installed and will not fit - or will time out building - on a small
# instance. Every use of them is lazily imported behind a working fallback:
# embeddings drop to a deterministic TF-IDF space and contradiction detection to
# numeric claim comparison, so the pipeline still runs end to end.
#
# Measured on a 30-paper corpus with this exact install: 174 MB of packages,
# full pipeline in 13 s, all 435 document pairs scored.
#
# To use transformer embeddings and the NLI model instead, change the build
# command to `pip install -e ".[ml]"` and move to an instance with at least
# 2 GB of RAM and 4 GB of disk.

services:
  - type: web
    name: rpra-api
    runtime: python
    plan: free
    region: oregon

    # Deliberately installs from requirements.txt rather than `pip install -e .`.
    # A build command ending in a bare "." loses its last character too easily
    # when pasted into a web form, and `pip install -e` without an argument
    # fails with a message that does not obviously name the cause.
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn rpra.server:app --host 0.0.0.0 --port $PORT --workers 1"

    healthCheckPath: /api/status

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # Keeps pip from caching wheels into the image, which matters on a small
      # build disk.
      - key: PIP_NO_CACHE_DIR
        value: "1"

      # Optional. Leave unset and the pipeline uses the heuristic extraction
      # backend, which needs no key and no account. Setting it only enables the
      # `llm` extraction backend and explanation generation - and that also
      # requires `pip install -e ".[llm]"` in the build command.
      - key: OPENAI_API_KEY
        sync: false

    # The free plan has an ephemeral filesystem: uploaded PDFs and generated
    # reports are lost when the instance restarts or spins down. Attach a disk
    # (paid plans) if the corpus needs to survive restarts.
    #
    # disk:
    #   name: corpus
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
